# REMSFAL - Reverse Proxy Konfiguration für das Getting-Started Docker Setup
#
# Bündelt das Frontend und alle Backend-Microservices unter einem
# gemeinsamen Origin (http://localhost:8090), analog zum Proxy des
# Vite-Dev-Servers in der lokalen Frontend-Entwicklung.

server {
    listen 80;
    server_name localhost;

    # Ticketing-Microservice (Mängel, Aufgaben, Chat, Angebote)
    location /ticketing/ {
        proxy_pass http://remsfal-ticketing:8081/ticketing/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notification-Microservice
    location /notification/ {
        proxy_pass http://remsfal-notification:8082/notification/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Platform-Microservice (Login, Nutzer, Liegenschaften, Organisationen)
    location /api/ {
        proxy_pass http://remsfal-platform:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Single Page Application)
    location / {
        proxy_pass http://remsfal-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
